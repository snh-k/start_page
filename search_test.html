<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>캐릭터 조회</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #181824; color: #fff; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .container { width: 100%; max-width: 1000px; background: #232334; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { margin-top: 0; color: #4ecca3; text-align: center; font-size: 24px; }
        
        .input-group { margin-bottom: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #181824; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background: #4ecca3; border: none; color: #181824; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #45b393; }
        
        #loading { text-align: center; color: #aaa; font-size: 15px; margin: 20px 0; display: none; }
        .result-section { display: none; }
        
        .card { background: #181824; padding: 18px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
        .card h3 { margin-top: 0; color: #4ecca3; border-bottom: 1px solid #333; padding-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; font-size: 14px; }
        .grid-item span { color: #4ecca3; font-weight: bold; }
        
        ul { margin: 0; padding-left: 20px; font-size: 13px; color: #ddd; max-height: 300px; overflow-y: auto; }
        li { margin-bottom: 8px; line-height: 1.5; }
        
        /* 장비 상세 카드 스타일 */
        .item-box { background: #1a1a26; border: 1px solid #444; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .item-header { font-weight: bold; color: #4ecca3; font-size: 15px; margin-bottom: 6px; }
        .item-detail { font-size: 12px; color: #bbb; margin-top: 4px; }
        .item-detail span { color: #a5d6ff; }
        
        /* 활성화된 프리셋 굵게 및 강조 스타일 */
        .active-preset { font-weight: bold; color: #fff !important; background: rgba(78, 204, 163, 0.15); padding: 2px 4px; border-radius: 4px; border-left: 3px solid #4ecca3; }
        .preset-tag { background: #2e2e42; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #4ecca3; margin-right: 4px; display: inline-block; width: 140px; }

        .error-card { background: #3a1c1c; border: 1px solid #ff6b6b; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; color: #ff9999; }
        .error-card span { font-weight: bold; }

        details { margin-top: 15px; color: #888; font-size: 12px; }
        pre { background: #11111a; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: monospace; color: #a5d6ff; font-size: 12px; max-height: 400px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="container">
        <h2>캐릭터 조회</h2>

        <div class="input-group">
            <input type="text" id="charName" placeholder="영웅(캐릭터) 명" onkeydown="if(event.key === 'Enter') fetchAllData()">
            <button onclick="fetchAllData()">찾기</button>
        </div>

        <div id="loading">서버 과부하 방지를 위해 시간차를 두고 순차 조회 중입니다...</div>

        <div class="result-section" id="resultSection">
            
            <!-- 1. 기본 프로필 상세 정보 -->
            <div class="card">
                <h3>1. 기본 프로필 정보 <span id="statusBasic" style="font-size: 12px;"></span></h3>
                <div class="grid-2" id="contentBasic"></div>
            </div>

            <!-- 드레스 수집 포인트 -->
            <div class="card">
                <h3>1-1. 드레스 수집 포인트 <span id="statusDress" style="font-size: 12px;"></span></h3>
                <div class="grid-3" id="contentDressPoint"></div>
            </div>

            <!-- 스킬 각성 목록 -->
            <div class="card">
                <h3>1-2. 스킬 각성 목록 <span id="statusSkill" style="font-size: 12px;"></span></h3>
                <ul id="contentSkillAwakening"></ul>
            </div>

            <!-- 타이틀 능력치 합계 -->
            <div class="card">
                <h3>1-3. 타이틀 능력치 합계 <span id="statusTitleStat" style="font-size: 12px;"></span></h3>
                <div class="grid-2" id="contentTitleStat"></div>
            </div>

            <!-- 2. 길드 정보 -->
            <div class="card">
                <h3>2. 길드 정보 <span id="statusGuild" style="font-size: 12px;"></span></h3>
                <div class="grid-2" id="contentGuild"></div>
            </div>

            <!-- 3. 전투 능력치 (스탯) -->
            <div class="card">
                <h3>3. 전투 능력치 (스탯) <span id="statusStat" style="font-size: 12px;"></span></h3>
                <div class="grid-2" id="contentStat"></div>
            </div>

            <!-- 4. 장착 아이템 상세 정보 (핵심 전투 장비만 필터링) -->
            <div class="card">
                <h3>4. 장착 아이템 <span id="statusItem" style="font-size: 12px;"></span></h3>
                <div id="contentItemDetailed"></div>
            </div>

            <!-- 5. 장착 타이틀 / 문양 정보 -->
            <div class="card">
                <h3>5. 장착 중인 타이틀 / 문양 <span id="statusTitleEquip" style="font-size: 12px;"></span></h3>
                <ul id="contentTitleEquip"></ul>
            </div>

            <!-- 6. 타이틀 / 문양 보유 정보 -->
            <div class="card">
                <h3>6. 타이틀 / 문양 보유 정보 <span id="statusTitleHold" style="font-size: 12px;"></span></h3>
                <ul id="contentTitleHold"></ul>
            </div>

            <!-- 개발자용 원본 JSON 보기 -->
            <details>
                <summary>개발자용: 수신된 전체 원본 JSON 데이터 확인</summary>
                <pre id="rawJsonViewer">데이터 없음</pre>
            </details>
        </div>
    </div>

    <script>
        const FIXED_API_KEY = "test_5b79de8ba3b4f7e291e65742ad89873aa30c2d1ee561bf7e2bef85ac171edb3b744db58c289510302b69be32ae60bc77";
        const BASE_URL = "https://open.api.nexon.com/heroes/v2";

        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function safeFetch(url, headers) {
            try {
                const response = await fetch(url, { headers });
                const data = await response.json();

                if (!response.ok) {
                    return {
                        ok: false,
                        status: response.status,
                        error: data.error || { name: "HttpError", message: `HTTP Status ${response.status}` }
                    };
                }
                return {
                    ok: true,
                    status: response.status,
                    data: data
                };
            } catch (err) {
                return {
                    ok: false,
                    status: 0,
                    error: { name: "NetworkError", message: err.message }
                };
            }
        }

        async function fetchAllData() {
            const charName = document.getElementById('charName').value.trim();
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');

            if (!charName) {
                alert("캐릭터명을 입력해주세요.");
                return;
            }

            loading.style.display = "block";
            resultSection.style.display = "none";

            const headers = {
                "accept": "application/json",
                "x-nxopen-api-key": FIXED_API_KEY
            };

            const debugResult = { character_name: charName };

            try {
                const idRes = await safeFetch(`${BASE_URL}/id?character_name=${encodeURIComponent(charName)}`, headers);
                debugResult.id = idRes.ok ? idRes.data : { error: idRes.error };

                if (!idRes.ok || !idRes.data.ocid) {
                    alert(`OCID 조회 실패: [${idRes.error.name}] ${idRes.error.message}`);
                    return;
                }

                const ocid = idRes.data.ocid;
                debugResult.ocid = ocid;

                // 시간차 순차 호출 (429 에러 방지)[cite: 2]
                const basicRes = await safeFetch(`${BASE_URL}/character/basic?ocid=${ocid}`, headers);
                await delay(180);
                const titleHoldRes = await safeFetch(`${BASE_URL}/character/title?ocid=${ocid}`, headers);
                await delay(180);
                const titleEquipRes = await safeFetch(`${BASE_URL}/character/title-equipment?ocid=${ocid}`, headers);
                await delay(180);
                const itemEquipRes = await safeFetch(`${BASE_URL}/character/item-equipment?ocid=${ocid}`, headers);
                await delay(180);
                const statRes = await safeFetch(`${BASE_URL}/character/stat?ocid=${ocid}`, headers);
                await delay(180);
                const guildRes = await safeFetch(`${BASE_URL}/character/guild?ocid=${ocid}`, headers);

                debugResult.basic = basicRes.ok ? basicRes.data : { error: basicRes.error };
                debugResult.title_hold = titleHoldRes.ok ? titleHoldRes.data : { error: titleHoldRes.error };
                debugResult.title_equipment = titleEquipRes.ok ? titleEquipRes.data : { error: titleEquipRes.error };
                debugResult.item_equipment = itemEquipRes.ok ? itemEquipRes.data : { error: itemEquipRes.error };
                debugResult.stat = statRes.ok ? statRes.data : { error: statRes.error };
                debugResult.guild = guildRes.ok ? guildRes.data : { error: guildRes.error };

                renderBasicInfo(basicRes);
                renderGuildInfo(guildRes);
                renderStatInfo(statRes);
                renderDetailedItemEquipment(itemEquipRes);

                renderListInfo('contentTitleEquip', 'statusTitleEquip', titleEquipRes, ['title_equipment'], t => 
                    `[${t.title_equipment_type_name || t.title_type || '위치'}] ${t.title_name || '명칭 없음'}`
                );

                renderListInfo('contentTitleHold', 'statusTitleHold', titleHoldRes, ['title'], t => 
                    `[${t.title_type === 'pattern' ? '문양' : '타이틀'}] ${t.title_name || '명칭 없음'}`
                );

                document.getElementById('rawJsonViewer').textContent = JSON.stringify(debugResult, null, 2);
                resultSection.style.display = "block";

            } catch (error) {
                console.error("실행 중 치명적 오류 발생:", error);
                alert(`오류 발생: ${error.message}`);
            } finally {
                loading.style.display = "none";
            }
        }

        function renderBasicInfo(res) {
            const container = document.getElementById('contentBasic');
            const dpContainer = document.getElementById('contentDressPoint');
            const skillContainer = document.getElementById('contentSkillAwakening');
            const titleStatContainer = document.getElementById('contentTitleStat');
            
            const statusBasic = document.getElementById('statusBasic');
            const statusDress = document.getElementById('statusDress');
            const statusSkill = document.getElementById('statusSkill');
            const statusTitleStat = document.getElementById('statusTitleStat');

            container.innerHTML = '';
            dpContainer.innerHTML = '';
            skillContainer.innerHTML = '';
            titleStatContainer.innerHTML = '';

            if (!res.ok) {
                const errHtml = createErrorHtml(res.error);
                statusBasic.innerHTML = `<span style="color:#ff6b6b;">[에러 ${res.status}]</span>`;
                statusDress.innerHTML = statusSkill.innerHTML = statusTitleStat.innerHTML = "";
                container.innerHTML = errHtml;
                return;
            }

            statusBasic.innerHTML = statusDress.innerHTML = statusSkill.innerHTML = statusTitleStat.innerHTML = `<span style="color:#4ecca3;">[성공 200]</span>`;
            const d = res.data;

            container.innerHTML = `
                <div class="grid-item">캐릭터명: <span>${d.character_name || '-'}</span></div>
                <div class="grid-item">직업: <span>${d.character_class_name || '-'}</span></div>
                <div class="grid-item">레벨: <span>${d.character_level || 0}</span></div>
                <div class="grid-item">성별: <span>${d.character_gender || '-'}</span></div>
                <div class="grid-item">생성일: <span>${d.character_date_create ? d.character_date_create.replace('T', ' ').replace('Z', '') : '-'}</span></div>
                <div class="grid-item">최근 7일 접속: <span>${d.access_flag === 'true' || d.access_flag === true ? '접속함 (O)' : '미접속 (X)'}</span></div>
                <div class="grid-item">카르제 이름: <span>${d.cairde_name || '-'}</span></div>
                <div class="grid-item">총 타이틀 수: <span>${d.total_title_count || 0} (내: ${d.title_count || 0}, ID: ${d.id_title_count || 0})</span></div>
            `;

            if (d.dress_point) {
                const dp = d.dress_point;
                dpContainer.innerHTML = `
                    <div class="grid-item">총 포인트: <span>${dp.total_point?.toLocaleString() || 0}</span></div>
                    <div class="grid-item">아바타 포인트: <span>${dp.avatar_point?.toLocaleString() || 0}</span></div>
                    <div class="grid-item">등 포인트: <span>${dp.back_point?.toLocaleString() || 0}</span></div>
                    <div class="grid-item">꼬리 포인트: <span>${dp.tail_point?.toLocaleString() || 0}</span></div>
                    <div class="grid-item">오브젝트 포인트: <span>${dp.object_point?.toLocaleString() || 0}</span></div>
                `;
            } else {
                dpContainer.innerHTML = '<div class="grid-item">드레스 포인트 정보가 없습니다.</div>';
            }

            if (d.skill_awakening && d.skill_awakening.length > 0) {
                d.skill_awakening.forEach(sk => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>[${sk.skill_name}]</strong> ➔ 각성의 돌: <span style="color:#4ecca3;">${sk.item_name}</span>`;
                    skillContainer.appendChild(li);
                });
            } else {
                skillContainer.innerHTML = '<li>적용된 스킬 각성 정보가 없습니다.</li>';
            }

            if (d.title_stat && d.title_stat.length > 0) {
                d.title_stat.forEach(ts => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.innerHTML = `${ts.stat_name}: <span>+${ts.stat_value}</span>`;
                    titleStatContainer.appendChild(div);
                });
            } else {
                titleStatContainer.innerHTML = '<div class="grid-item">타이틀 스탯 정보가 없습니다.</div>';
            }
        }

        function renderGuildInfo(res) {
            const container = document.getElementById('contentGuild');
            const statusBadge = document.getElementById('statusGuild');
            container.innerHTML = '';

            if (!res.ok) {
                statusBadge.innerHTML = `<span style="color:#ff6b6b;">[에러 ${res.status}]</span>`;
                container.innerHTML = createErrorHtml(res.error);
                return;
            }
            statusBadge.innerHTML = `<span style="color:#4ecca3;">[성공 200]</span>`;
            const d = res.data;
            container.innerHTML = `
                <div class="grid-item" style="grid-column: span 2;">가입/신청한 길드 명: <span>${d.guild_name || '소속 길드 없음'}</span></div>
            `;
        }

        function renderStatInfo(res) {
            const container = document.getElementById('contentStat');
            const statusBadge = document.getElementById('statusStat');
            container.innerHTML = '';

            if (!res.ok) {
                statusBadge.innerHTML = `<span style="color:#ff6b6b;">[F에러 ${res.status}]</span>`;
                container.innerHTML = createErrorHtml(res.error);
                return;
            }
            statusBadge.innerHTML = `<span style="color:#4ecca3;">[성공 200]</span>`;
            const stats = res.data.stat || [];
            if (stats.length > 0) {
                stats.forEach(st => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.innerHTML = `${st.stat_name}: <span>${st.stat_value}</span>`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<div class="grid-item">능력치 데이터가 없습니다.</div>';
            }
        }

        // 4. 장착 아이템 상세 정보 렌더링 (요청하신 불필요 외형/아바타 슬롯 제외)
        function renderDetailedItemEquipment(res) {
            const container = document.getElementById('contentItemDetailed');
            const statusBadge = document.getElementById('statusItem');
            container.innerHTML = '';

            if (!res.ok) {
                statusBadge.innerHTML = `<span style="color:#ff6b6b;">[에러 ${res.status}]</span>`;
                container.innerHTML = createErrorHtml(res.error);
                return;
            }
            statusBadge.innerHTML = `<span style="color:#4ecca3;">[성공 200]</span>`;

            // 제외할 슬롯 및 아바타/외형 목록 정의
            const excludedSlots = [
                "Hair", "MakeUp,Beard", "Inner Armor", 
                "Avatar_Helm", "Avatar_Tunic", "Avatar_Pants", 
                "Avatar_Gloves", "Avatar_Boots", "Avatar_Weapon",
                "BodyPainting", "Body Shape", "Avatar_Rear",
                "Avatar_Tail", "AVATAR_DOLL", "FacePainting", "Lens"
            ];

            const rawItems = res.data.item_equipment || [];
            // 슬롯 이름이 제외 목록에 포함되지 않는 장비만 필터링
            const items = rawItems.filter(item => !excludedSlots.includes(item.item_equipment_slot_name));

            if (items.length > 0) {
                items.forEach(item => {
                    const opt = item.item_option || {};
                    const enhance = opt.enhancement_level ? `+${opt.enhancement_level}` : '';
                    const slot = item.item_equipment_slot_name ? `[${item.item_equipment_slot_name}]` : '';
                    const page = item.item_equipment_page ? `(${item.item_equipment_page})` : '';

                    // 접두 인챈트
                    const p1Prefix = opt.prefix_enchant_preset_1 || '없음';
                    const p2Prefix = opt.prefix_enchant_preset_2 || '없음';
                    const isP1PrefixActive = (opt.prefix_enchant_use_preset_no === 1);
                    const isP2PrefixActive = (opt.prefix_enchant_use_preset_no === 2);

                    // 접미 인챈트
                    const p1Suffix = opt.suffix_enchant_preset_1 || '없음';
                    const p2Suffix = opt.suffix_enchant_preset_2 || '없음';
                    const isP1SuffixActive = (opt.suffix_enchant_use_preset_no === 1);
                    const isP2SuffixActive = (opt.suffix_enchant_use_preset_no === 2);

                    // 정령합성 포맷터
                    const formatPiStats = (piData) => {
                        if (!piData) return null;
                        if (Array.isArray(piData)) {
                            if (piData.length === 0) return null;
                            return piData.map(t => `${t.stat_name} +${t.stat_value}`).join(', ');
                        }
                        if (typeof piData === 'object' && piData.stat_name) {
                            return `${piData.stat_name} +${piData.stat_value}`;
                        }
                        return null;
                    };

                    const pi1Text = formatPiStats(opt.power_infusion_preset_1);
                    const pi2Text = formatPiStats(opt.power_infusion_preset_2);
                    const piActiveNo = opt.power_infusion_use_preset_no;
                    const isPi1Active = (piActiveNo === 1);
                    const isPi2Active = (piActiveNo === 2);

                    // 연마 및 어빌리티
                    let tuningText = '';
                    if (Array.isArray(opt.tuning_stat) && opt.tuning_stat.length > 0) {
                        tuningText = opt.tuning_stat.map(t => `${t.stat_name} +${t.stat_value}`).join(', ');
                    }
                    const abilityText = opt.ability_name ? `어빌리티: ${opt.ability_name}` : '';

                    let html = `<div class="item-header">${slot} ${enhance} ${item.item_name || '아이템 명 없음'} ${page}</div>`;
                    
                    html += `<div class="item-detail"><span class="preset-tag">접두 프리셋 1</span><span class="${isP1PrefixActive ? 'active-preset' : ''}">${p1Prefix}${isP1PrefixActive ? ' ⭐(활성)' : ''}</span></div>`;
                    html += `<div class="item-detail"><span class="preset-tag">접두 프리셋 2</span><span class="${isP2PrefixActive ? 'active-preset' : ''}">${p2Prefix}${isP2PrefixActive ? ' ⭐(활성)' : ''}</span></div>`;
                    
                    html += `<div class="item-detail"><span class="preset-tag">접미 프리셋 1</span><span class="${isP1SuffixActive ? 'active-preset' : ''}">${p1Suffix}${isP1SuffixActive ? ' ⭐(활성)' : ''}</span></div>`;
                    html += `<div class="item-detail"><span class="preset-tag">접미 프리셋 2</span><span class="${isP2SuffixActive ? 'active-preset' : ''}">${p2Suffix}${isP2SuffixActive ? ' ⭐(활성)' : ''}</span></div>`;

                    if (pi1Text || pi2Text || piActiveNo !== undefined) {
                        html += `<div class="item-detail"><span class="preset-tag">정령합성 프리셋 1</span><span class="${isPi1Active ? 'active-preset' : ''}">${pi1Text || '없음'}${isPi1Active ? ' ⭐(활성)' : ''}</span></div>`;
                        html += `<div class="item-detail"><span class="preset-tag">정령합성 프리셋 2</span><span class="${isPi2Active ? 'active-preset' : ''}">${pi2Text || '없음'}${isPi2Active ? ' ⭐(활성)' : ''}</span></div>`;
                    }

                    if (tuningText) {
                        html += `<div class="item-detail">연마: <span>${tuningText}</span></div>`;
                    }
                    if (abilityText) {
                        html += `<div class="item-detail"><span>${abilityText}</span></div>`;
                    }

                    const div = document.createElement('div');
                    div.className = 'item-box';
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<div class="item-box">출력할 전투 장비 정보가 없습니다.</div>';
            }
        }

        function renderListInfo(elementId, statusId, res, possibleKeys, formatter) {
            const ul = document.getElementById(elementId);
            const statusBadge = document.getElementById(statusId);
            ul.innerHTML = '';

            if (!res.ok) {
                statusBadge.innerHTML = `<span style="color:#ff6b6b;">[에러 ${res.status}]</span>`;
                ul.innerHTML = `<li>${createErrorHtml(res.error)}</li>`;
                return;
            }
            statusBadge.innerHTML = `<span style="color:#4ecca3;">[성공 200]</span>`;
            
            let list = [];
            for (const key of possibleKeys) {
                if (res.data[key] && Array.isArray(res.data[key])) {
                    list = res.data[key];
                    break;
                }
            }

            if (list.length > 0) {
                list.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = formatter(item);
                    ul.appendChild(li);
                });
            } else {
                ul.innerHTML = '<li>데이터가 존재하지 않습니다.</li>';
            }
        }

        function createErrorHtml(err) {
            return `<div class="error-card"><span>[${err.name || 'Error'}]</span> ${err.message || '알 수 없는 오류'}</div>`;
        }
    </script>
</body>
</html>
